<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fafa</title>
<meta name="description" content="一句话，就记好一笔。输入「奶茶15」，金额和分类自动填好。无需注册，离线可用，账目保存在本机。">

<!-- 分享预览卡片。有人把这个网址发到微信、备忘录、iMessage 时靠下面这几个标签渲染，
     不填就只有一行光秃秃的域名。
     ⚠️ og:image 必须写绝对地址，相对路径抓不到。改了这一段记得 push，
     线上那份才是别人看到的。 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="fafa">
<meta property="og:title" content="fafa · 一句话记账">
<meta property="og:description" content="输入「奶茶15」，金额和分类自动填好。该花花就发发。">
<meta property="og:url" content="https://mlnxsg.github.io/fafa-site/">
<meta property="og:image" content="https://mlnxsg.github.io/fafa-site/og-image.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="fafa 的 App 图标">
<meta property="og:locale" content="zh_CN">
<!-- 图是方的（就是 App 图标），所以用 summary 不是 summary_large_image -->
<meta name="twitter:card" content="summary">
<link rel="apple-touch-icon" href="https://mlnxsg.github.io/fafa-site/og-image.png">
<link rel="icon" href="https://mlnxsg.github.io/fafa-site/og-image.png">
<style>
  :root {
    --ground: #F7F4EF;        /* 页底，比 App 的 #F3F0EB 略浅一点，衬得出右边那块面板 */
    --panel: #F1ECE5;         /* 手机后面那块浅面板 */
    --ink: #241C18;           /* 大标题 */
    --ink-soft: #4E443D;      /* 正文 */
    --muted: #8B7E75;         /* 次要文字、图标 */
    --brand: #B08268;         /* 陶土棕，跟 App 同一支 */
    --brand-deep: #9A6E56;    /* 按钮/强调，比 brand 深一档 */
    /* 按钮试过 App 图标里那支鼠尾草绿 #8A9C87，不好看，换回陶土棕了。
       （那支绿配白字对比度只有 2.9:1，也不过 WCAG AA。） */
    --line: #E3DBD2;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* 整页要在一屏里放得下（宽屏时不用滚就能看到页脚那句「该花花，就发发。」）：
     body 是一列 flex、撑满 100vh，中间那块 flex:1，页脚自然贴底；
     真正吃高度的是右边那张手机截图，所以它的高度跟着视口算，见 .phone。 */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex; flex-direction: column;
    background: var(--ground);
    color: var(--ink-soft);
    font: 16px/1.8 -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; width: 100%; }
  .wrap--main { flex: 1; display: flex; flex-direction: column; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; padding: clamp(16px, 2.6vh, 26px) 0 0;
  }
  /* 字标和它下面那句标语是一块，所以顶栏按 flex-start 对齐、
     右边的链接用 padding-top 顶回字标那一行的高度 */
  .brand { display: flex; flex-direction: column; gap: 6px; }
  .topbar img { width: 92px; height: auto; display: block; }
  .topbar nav { display: flex; gap: 26px; padding-top: 9px; }
  .topbar a { color: var(--muted); font-size: 14px; text-decoration: none; }
  .topbar a:hover { color: var(--brand-deep); }

  /* ---------- 主区 ---------- */
  .hero {
    flex: 1;
    display: grid;
    /* ⚠️ 右列用 auto，不要写死宽度（原来是 minmax(300px, 420px)）：
       手机的宽度是由高度和图片比例算出来的，列宽写死就会比手机宽出一大截，
       面板左右各空出一条没有内容的色带，看着就是一块莫名其妙的颜色。
       auto 让这一列跟着面板的内容宽走，面板自然贴着手机。 */
    grid-template-columns: 1fr auto;
    gap: 48px;
    align-items: center;
    padding: clamp(16px, 3.5vh, 48px) 0;
  }

  .eyebrow {
    display: flex; align-items: center; gap: 10px;
    margin: 0; color: var(--brand); font-size: 14px; letter-spacing: 1px;
  }
  .eyebrow::before {
    content: ""; width: 22px; height: 1px; background: var(--brand); flex: none;
  }

  h1 {
    margin: 0 0 26px;
    /* ⚠️ 中文重量级字体没法上网（动辄 3~5MB），只能用系统字体：
       iPhone / Mac 上是 PingFang SC，跟设计稿接近；Windows 上会细一些。 */
    font-size: clamp(38px, 7.2vw, 66px);
    line-height: 1.18;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  h1 .accent { color: var(--brand); display: block; }

  .lede { margin: 0 0 32px; font-size: 16px; color: var(--ink-soft); }

  /* ⚠️ 这是一颗**不可点**的状态胶囊，不是按钮：现在没有任何地方可以跳。
     上架当天换成 <a class="cta" href="https://apps.apple.com/app/id6811014619">在 App Store 下载</a>
     并把 cursor/hover 打开。审核期间不能提前换——产品页没公开，点了是 404。 */
  .cta {
    display: inline-block; cursor: default; user-select: none;
    padding: 14px 30px; border-radius: 999px;
    background: var(--brand-deep); color: #fff;
    font-size: 15px; letter-spacing: .3px;
    box-shadow: 0 6px 18px rgba(154, 110, 86, .22);
  }

  .feats {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    margin: 36px 0 0; padding: 0; list-style: none;
    color: var(--muted); font-size: 14px;
  }
  .feats li { display: flex; align-items: center; gap: 8px; }
  .feats svg { width: 18px; height: 18px; flex: none; }
  .feats .dot { color: var(--line); }

  /* ---------- 右边的手机 ---------- */
  .shot {
    background: var(--panel);
    border-radius: 28px;
    padding: clamp(14px, 2.4vh, 28px);
    display: flex; justify-content: center;
    justify-self: center;  /* 窄屏收成一列时居中 */
  }
  /* ⚠️ 这里是**按高度**定尺寸、宽度由图片比例自己算出来的，不是反过来。
     整页要塞进一屏，而这张截图是最高的那一块，所以它必须跟着视口缩：
     减去的 340px ≈ 顶栏 + 页脚 + 上下留白 + .shot 自己的内边距。
     上限 650px 是原尺寸（300 宽 × 828:1792 的比例），高屏幕上不会被拉大。
     换一张不同比例的截图不用改这里，宽度会自己跟着变。 */
  .phone {
    height: clamp(300px, calc(100vh - 340px), 650px);
    width: auto; max-width: 100%;
    border-radius: 30px; overflow: hidden;
    background: #fff;
    /* 一层就够。软不软看的是模糊半径够不够大、透明度够不够低，不是层数 */
    box-shadow: 0 14px 44px rgba(36, 28, 24, .10);
  }
  .phone img { display: block; height: 100%; width: auto; }

  /* ---------- 页脚 ---------- */
  footer {
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: flex-end;
    gap: 16px; padding: clamp(14px, 2.2vh, 24px) 0 clamp(16px, 3vh, 36px);
    color: var(--muted); font-size: 13px;
  }
  .sign { display: flex; align-items: center; gap: 10px; }
  /* 双 f 的 App 图标。图本身是满幅奶白的方图（iOS 自己切圆角），
     网页上得自己圆一下，否则会在页底露出一个颜色略深的方块。
     这里复用 og-image.png——它就是同一张 App 图标，而且 <link rel="icon">
     已经让浏览器下过一次了，footer 再引一次不额外花流量。 */
  .sign img { width: 30px; height: 30px; border-radius: 7px; display: block; }

  /* ---------- 窄屏：一列 ---------- */
  @media (max-width: 860px) {
    .hero {
      grid-template-columns: 1fr;
      gap: 40px;
      padding: 40px 0 56px;
      text-align: center;
    }
    .feats { justify-content: center; }
    .shot { order: 2; padding: 20px; }
    h1 { margin-bottom: 20px; }
    /* 窄屏本来就是要往下滚的，截图不跟视口缩，退回按宽度定尺寸 */
    .phone { height: auto; width: 100%; max-width: 300px; }
    .phone img { width: 100%; height: auto; }
  }
  @media (max-width: 420px) {
    /* 窄屏顶栏一行要塞下「字标+标语」和两个链接，标语跟着缩一档 */
    .topbar nav { gap: 16px; }
    .topbar nav a { font-size: 13px; }
    .eyebrow { font-size: 13px; gap: 8px; letter-spacing: .5px; }
    .eyebrow::before { width: 16px; }
    .shot { padding: 18px; border-radius: 22px; }
  }
</style>
</head>
<body>

<div class="wrap wrap--main">
  <header class="topbar">
    <div class="brand">
      <img src="wordmark.png" alt="fafa" width="383" height="197">
      <p class="eyebrow">一句话记账</p>
    </div>
    <nav>
      <a href="privacy.html">隐私说明</a>

  <main class="hero">

          无需注册

        <li class="dot" aria-hidden="true">·</li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"

            <path d="M2 8.5a16 16 0 0 1 6-3.6"/><path d="M13.5 5.3A16 16 0 0 1 22 8.5"/>
            <path d="M5.5 12.4a11 11 0 0 1 3-1.8"/><path d="M15.5 10.9a11 11 0 0 1 3 1.5"/>
            <path d="M9 16a6 6 0 0 1 4.5-1.2"/><circle cx="12" cy="19.5" r="1"/>

          </svg>
          离线可用
        </li>
        <li class="dot" aria-hidden="true">·</li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"

        </li>

    </div>

    <div class="shot">
      <div class="phone">
        <!-- 真机截图，不是 CSS 画的假界面：以后 App 改了版式换这张图就行 -->
        <img src="app-home.png" alt="fafa 的记账主页：输入「奶茶15」，自动归类到餐饮">
      </div>
    </div>
  </main>
</div>

<div class="wrap">
  <footer>
    <span class="sign">
      <img src="og-image.png" alt="fafa" width="1024" height="1024">
      该花花，就发发。
    </span>
  </footer>
</div>

</body>
